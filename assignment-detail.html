<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Detail - Team Space</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Left Sidebar Navigation -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">🐱</div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html" title="Home">
                <span class="menu-icon">🏠</span>
                <span class="menu-text">Home</span>
            </a></li>
            <li><a href="team.html" title="Team">
                <span class="menu-icon">👥</span>
                <span class="menu-text">Team</span>
            </a></li>
            <li><a href="assignments.html" title="Assignments">
                <span class="menu-icon">📝</span>
                <span class="menu-text">Assignments</span>
            </a></li>
            <li><a href="final-project.html" title="Projects">
                <span class="menu-icon">🚀</span>
                <span class="menu-text">Projects</span>
            </a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <section class="page-header">
            <div class="container">
                <h1 class="page-title" id="detailTitle">Assignment Details</h1>
                <p class="page-subtitle">View detailed information about this assignment</p>
            </div>
        </section>

        <!-- Assignment Detail Section -->
        <section class="content-section">
            <div class="container">
                <div class="assignment-detail-card" id="assignmentDetailCard">
                    <!-- Assignment details will be loaded here -->
                </div>
                
                <div style="margin-top: 30px; text-align: center;">
                    <a href="assignments.html" class="btn btn-secondary">← Back to Assignments</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        // Load assignment details when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadAssignmentDetail();
        });

        function loadAssignmentDetail() {
            // Get assignment ID from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const assignmentId = urlParams.get('assignmentId');
            
            if (!assignmentId) {
                document.getElementById('assignmentDetailCard').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: var(--text-secondary);">
                        <div style="font-size: 64px; margin-bottom: 20px;">❌</div>
                        <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">No assignment specified</h3>
                        <p style="font-size: 15px;">Please return to the assignments list and select an assignment.</p>
                    </div>
                `;
                return;
            }

            // Try to get assignment data from sessionStorage first
            let assignment = null;
            try {
                const storedData = sessionStorage.getItem('currentAssignment');
                if (storedData) {
                    assignment = JSON.parse(storedData);
                }
            } catch (e) {
                console.error('Error parsing session storage:', e);
            }

            // If not in sessionStorage, get from localStorage
            if (!assignment || assignment.id != assignmentId) {
                const assignments = JSON.parse(localStorage.getItem('assignments') || '[]');
                assignment = assignments.find(a => a.id == assignmentId);
            }

            if (!assignment) {
                document.getElementById('assignmentDetailCard').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: var(--text-secondary);">
                        <div style="font-size: 64px; margin-bottom: 20px;">🔍</div>
                        <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Assignment not found</h3>
                        <p style="font-size: 15px;">The requested assignment could not be found.</p>
                    </div>
                `;
                return;
            }

            // Update page title
            document.getElementById('detailTitle').textContent = assignment.title;

            // Render assignment details
            const statusClass = `status-${assignment.status}`;
            const statusText = {
                'pending': '⏳ Pending',
                'submitted': '📤 Submitted',
                'grading': '🔍 Grading',
                'completed': '✅ Completed'
            }[assignment.status] || assignment.status;

            let filesHtml = '';
            if (assignment.files && assignment.files.length > 0) {
                filesHtml = '<div class="form-group"><label class="form-label">Submitted Files:</label><div class="selected-files-list">';
                assignment.files.forEach((file, index) => {
                    filesHtml += `<div class="file-item"><span>${file.name}</span><small>${formatFileSize(file.size)}</small></div>`;
                });
                filesHtml += '</div></div>';
            }

            const detailHtml = `
                <div class="assignment-header">
                    <div>
                        <h2 class="assignment-title">${assignment.title}</h2>
                        <div class="assignment-meta">
                            👤 ${assignment.submitter} | 📅 Deadline: ${assignment.deadline}
                        </div>
                    </div>
                    <span class="assignment-status ${statusClass}">${statusText}</span>
                </div>
                
                ${assignment.description ? `<div class="assignment-description" style="white-space: pre-wrap; line-height: 1.8; margin: 20px 0;"><strong>Description:</strong><br>${renderMarkdown(assignment.description)}</div>` : ''}
                
                ${filesHtml}
                
                ${assignment.teacherEvaluation ? `<div class="teacher-evaluation"><strong>Teacher's Comments:</strong><br>${renderMarkdown(assignment.teacherEvaluation)}</div>` : ''}
                
                <div class="assignment-actions" style="margin-top: 30px;">
                    <button class="btn btn-primary" onclick="openSubmitAssignmentModal(${assignment.id})"> Submit Assignment</button>
                    <button class="btn btn-secondary" onclick="openTeacherEvaluationModal(${assignment.id})">👨‍🏫 Evaluate</button>
                </div>
            `;

            document.getElementById('assignmentDetailCard').innerHTML = detailHtml;
        }

        // Helper function to format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
