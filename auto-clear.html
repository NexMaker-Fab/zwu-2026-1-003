<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing Team Data...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            font-size: 18px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>🗑️ Clearing All Team Data...</h1>
        <p>Please wait, redirecting to team page...</p>
    </div>

    <script>
        // Automatically clear all data on page load
        window.onload = function() {
            try {
                // Clear team members
                localStorage.removeItem('teamMembers');
                
                // Also clear other related data
                localStorage.removeItem('assignments');
                localStorage.removeItem('projects');
                localStorage.removeItem('githubConfig');
                
                console.log('✅ All team data cleared successfully!');
                
                // Wait 1 second then redirect to team page
                setTimeout(() => {
                    window.location.href = 'team.html';
                }, 1000);
                
            } catch (error) {
                console.error('❌ Error clearing data:', error);
                alert('Error clearing data. Please try manually in browser console:\n\nlocalStorage.clear()');
            }
        };
    </script>
</body>
</html>
