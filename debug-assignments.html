<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Assignments Data</title>
    <link rel="stylesheet" href="styles.css?v=19">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        
        .assignment-item {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        
        .assignment-item h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        
        .assignment-item p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Assignments Data</h1>
        
        <div class="info-box">
            <strong>Current localStorage Status:</strong>
            <div id="currentData">Loading...</div>
        </div>
        
        <div style="text-align: center; margin: 30px 0;">
            <button class="btn btn-success" onclick="forceKeepOnlyExercise1()">
                ✅ Force Keep Only Exercise 1
            </button>
            <button class="btn btn-danger" onclick="clearAllData()">
                🗑️ Clear All Data
            </button>
            <a href="assignments.html?v=19" class="btn">
                📋 View Assignments Page
            </a>
        </div>
        
        <div id="status" class="status" style="display: none;"></div>
    </div>

    <script>
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }
        
        function displayCurrentData() {
            const dataDiv = document.getElementById('currentData');
            
            try {
                const assignments = JSON.parse(localStorage.getItem('assignments') || '[]');
                
                let html = `<p><strong>Total Assignments:</strong> ${assignments.length}</p>`;
                
                if (assignments.length === 0) {
                    html += '<p style="color: #999;">No assignments found in localStorage.</p>';
                } else {
                    html += '<div style="margin-top: 15px;">';
                    assignments.forEach((a, i) => {
                        html += `
                            <div class="assignment-item">
                                <h3>${i + 1}. ${a.title}</h3>
                                <p><strong>ID:</strong> ${a.id}</p>
                                <p><strong>Status:</strong> ${a.status || 'N/A'}</p>
                                <p><strong>Description:</strong> ${a.description ? a.description.substring(0, 100) + '...' : 'N/A'}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                html += `
                    <div style="margin-top: 20px;">
                        <strong>Raw JSON:</strong>
                        <pre>${JSON.stringify(assignments, null, 2)}</pre>
                    </div>
                `;
                
                dataDiv.innerHTML = html;
            } catch (error) {
                dataDiv.innerHTML = `<p style="color: red;">Error reading localStorage: ${error.message}</p>`;
            }
        }
        
        function forceKeepOnlyExercise1() {
            try {
                // Clear all assignments first
                localStorage.removeItem('assignments');
                
                // Create fresh Exercise 1
                const exercise1 = {
                    id: Date.now(),
                    title: 'Exercise 1: Project Management',
                    description: 'View the complete guide at: exercise1-edit.html',
                    deadline: new Date().toISOString().split('T')[0],
                    submitter: 'All Members',
                    status: 'submitted',
                    createdAt: new Date().toISOString(),
                    submittedAt: new Date().toISOString()
                };
                
                localStorage.setItem('assignments', JSON.stringify([exercise1]));
                
                showStatus('✅ Successfully created fresh Exercise 1! All other data cleared.', 'success');
                
                // Refresh display
                setTimeout(() => {
                    displayCurrentData();
                }, 500);
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }
        
        function clearAllData() {
            if (confirm('Are you sure you want to clear ALL assignments data?')) {
                try {
                    localStorage.removeItem('assignments');
                    showStatus('✅ All assignments data cleared!', 'success');
                    
                    // Refresh display
                    setTimeout(() => {
                        displayCurrentData();
                    }, 500);
                } catch (error) {
                    showStatus('❌ Error: ' + error.message, 'error');
                }
            }
        }
        
        // Display current data on load
        displayCurrentData();
    </script>
</body>
</html>
