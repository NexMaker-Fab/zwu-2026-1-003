<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB8C00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="earGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#388E3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </radialGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 头部轮廓 -->
  <circle cx="32" cy="34" r="20" fill="url(#furGradient)" filter="url(#shadow)"/>
  
  <!-- 左耳 -->
  <path d="M 16 22 L 12 8 L 24 16 Z" fill="url(#earGradient)" stroke="#F57C00" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 17 20 L 14 11 L 22 17 Z" fill="#FFCCBC" opacity="0.6"/>
  
  <!-- 右耳 -->
  <path d="M 48 22 L 52 8 L 40 16 Z" fill="url(#earGradient)" stroke="#F57C00" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 47 20 L 50 11 L 42 17 Z" fill="#FFCCBC" opacity="0.6"/>
  
  <!-- 脸部高光 -->
  <ellipse cx="24" cy="26" rx="6" ry="4" fill="#FFFFFF" opacity="0.15"/>
  
  <!-- 左眼 -->
  <ellipse cx="25" cy="32" rx="4.5" ry="5" fill="url(#eyeGradient)"/>
  <ellipse cx="25" cy="32" rx="2" ry="3.5" fill="#1B5E20"/>
  <circle cx="26.5" cy="30.5" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="24" cy="33" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  
  <!-- 右眼 -->
  <ellipse cx="39" cy="32" rx="4.5" ry="5" fill="url(#eyeGradient)"/>
  <ellipse cx="39" cy="32" rx="2" ry="3.5" fill="#1B5E20"/>
  <circle cx="40.5" cy="30.5" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="38" cy="33" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  
  <!-- 鼻子 -->
  <path d="M 30 38 Q 32 36.5 34 38 Q 32 40 30 38" fill="#FF8A80" stroke="#E57373" stroke-width="0.5"/>
  
  <!-- 嘴巴 -->
  <path d="M 32 39.5 Q 30 41 28 40" fill="none" stroke="#5D4037" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 32 39.5 Q 34 41 36 40" fill="none" stroke="#5D4037" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- 胡须 - 左侧 -->
  <line x1="18" y1="36" x2="8" y2="34" stroke="#5D4037" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="38" x2="7" y2="38" stroke="#5D4037" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="40" x2="8" y2="42" stroke="#5D4037" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  
  <!-- 胡须 - 右侧 -->
  <line x1="46" y1="36" x2="56" y2="34" stroke="#5D4037" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="46" y1="38" x2="57" y2="38" stroke="#5D4037" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="46" y1="40" x2="56" y2="42" stroke="#5D4037" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  
  <!-- 额头条纹 -->
  <path d="M 28 24 Q 32 22 36 24" fill="none" stroke="#F57C00" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 29 26 Q 32 24.5 35 26" fill="none" stroke="#F57C00" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- 脸颊红晕 -->
  <ellipse cx="20" cy="38" rx="3" ry="2" fill="#FFAB91" opacity="0.4"/>
  <ellipse cx="44" cy="38" rx="3" ry="2" fill="#FFAB91" opacity="0.4"/>
</svg>
