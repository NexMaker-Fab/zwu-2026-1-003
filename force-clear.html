<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Clear All Data</title>
    <link rel="stylesheet" href="styles.css?v=15">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .description {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin: 5px;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .info-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }
        
        .info-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .info-list li:last-child {
            border-bottom: none;
        }
        
        .debug-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Force Clear All Data</h1>
        
        <div class="warning-box">
            <strong>️ Warning:</strong><br>
            This will completely clear ALL localStorage data and force reload the latest version from GitHub!
        </div>
        
        <p class="description">
            Use this if you're seeing old data or multiple assignments in incognito mode.
        </p>
        
        <div id="debugInfo" class="debug-info">
            Loading current data...
        </div>
        
        <div style="text-align: center;">
            <button class="btn btn-danger" onclick="forceClearAll()">
                🔧 Force Clear & Reload Latest Version
            </button>
            <a href="index.html" class="btn btn-secondary">
                ← Back to Home
            </a>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function updateDebugInfo() {
            const debugDiv = document.getElementById('debugInfo');
            
            try {
                const members = JSON.parse(localStorage.getItem('teamMembers') || '{}');
                const assignments = JSON.parse(localStorage.getItem('assignments') || '[]');
                const projects = JSON.parse(localStorage.getItem('projects') || '[]');
                
                let info = '<strong>Current localStorage Data:</strong><br><br>';
                info += `<strong>Team Members:</strong> ${Object.keys(members).length}<br>`;
                if (Object.keys(members).length > 0) {
                    Object.keys(members).forEach(id => {
                        info += `  - ID ${id}: ${members[id].name}<br>`;
                    });
                }
                
                info += `<br><strong>Assignments:</strong> ${assignments.length}<br>`;
                if (assignments.length > 0) {
                    assignments.forEach((a, i) => {
                        info += `  ${i + 1}. ${a.title} (ID: ${a.id})<br>`;
                    });
                }
                
                info += `<br><strong>Projects:</strong> ${projects.length}<br>`;
                
                debugDiv.innerHTML = info;
            } catch (error) {
                debugDiv.innerHTML = 'Error reading localStorage: ' + error.message;
            }
        }
        
        function forceClearAll() {
            try {
                // Clear ALL localStorage
                localStorage.clear();
                
                showStatus('✅ All data cleared! Reloading page...', 'success');
                
                // Force reload with cache busting
                setTimeout(() => {
                    window.location.href = 'index.html?v=' + Date.now();
                }, 1000);
                
            } catch (error) {
                console.error('Error:', error);
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }
        
        // Show current data on load
        updateDebugInfo();
    </script>
</body>
</html>
