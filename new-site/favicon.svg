<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black Cat Icon -->
  <circle cx="50" cy="50" r="45" fill="#2d2d44"/>
  
  <!-- Cat ears -->
  <polygon points="20,30 30,10 40,25" fill="#6c5ce7"/>
  <polygon points="60,25 70,10 80,30" fill="#6c5ce7"/>
  
  <!-- Cat face -->
  <ellipse cx="50" cy="55" rx="30" ry="25" fill="#1e1e2e"/>
  
  <!-- Eyes -->
  <ellipse cx="38" cy="50" rx="6" ry="8" fill="#fd79a8"/>
  <ellipse cx="62" cy="50" rx="6" ry="8" fill="#fd79a8"/>
  
  <!-- Pupils -->
  <circle cx="38" cy="50" r="3" fill="#1e1e2e"/>
  <circle cx="62" cy="50" r="3" fill="#1e1e2e"/>
  
  <!-- Nose -->
  <polygon points="47,58 53,58 50,62" fill="#fd79a8"/>
  
  <!-- Whiskers -->
  <line x1="25" y1="56" x2="42" y2="58" stroke="#b2bec3" stroke-width="1.5"/>
  <line x1="25" y1="60" x2="42" y2="60" stroke="#b2bec3" stroke-width="1.5"/>
  <line x1="25" y1="64" x2="42" y2="62" stroke="#b2bec3" stroke-width="1.5"/>
  
  <line x1="75" y1="56" x2="58" y2="58" stroke="#b2bec3" stroke-width="1.5"/>
  <line x1="75" y1="60" x2="58" y2="60" stroke="#b2bec3" stroke-width="1.5"/>
  <line x1="75" y1="64" x2="58" y2="62" stroke="#b2bec3" stroke-width="1.5"/>
  
  <!-- Mouth -->
  <path d="M 45 65 Q 50 68 55 65" stroke="#b2bec3" stroke-width="1.5" fill="none"/>
</svg>
