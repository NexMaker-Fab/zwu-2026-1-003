<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Test</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding: 40px;
            background: #f9f9f9;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #ff0000;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #cc0000;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Function Test Page</h1>
    
    <div class="test-section">
        <h2>Test 1: openModal Function</h2>
        <button onclick="testOpenModal()">Test openModal('editModal')</button>
        <div id="result1" class="result">Click button to test...</div>
    </div>

    <div class="test-section">
        <h2>Test 2: localStorage Check</h2>
        <button onclick="testLocalStorage()">Check localStorage</button>
        <div id="result2" class="result">Click button to test...</div>
    </div>

    <div class="test-section">
        <h2>Test 3: Team Members Init</h2>
        <button onclick="testMembersInit()">Initialize Members</button>
        <div id="result3" class="result">Click button to test...</div>
    </div>

    <!-- Edit Modal for testing -->
    <div class="modal" id="editModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:30px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,0.2); z-index:9999;">
        <h3>Edit Modal is Working!</h3>
        <button onclick="document.getElementById('editModal').style.display='none'">Close</button>
    </div>

    <script src="script.js"></script>
    <script>
        function testOpenModal() {
            try {
                if (typeof openModal === 'function') {
                    openModal('editModal');
                    document.getElementById('result1').textContent = '✅ openModal function exists and executed';
                } else {
                    document.getElementById('result1').textContent = '❌ openModal function not found';
                }
            } catch (e) {
                document.getElementById('result1').textContent = '❌ Error: ' + e.message;
            }
        }

        function testLocalStorage() {
            try {
                const members = JSON.parse(localStorage.getItem('teamMembers') || '{}');
                const assignments = JSON.parse(localStorage.getItem('assignments') || '[]');
                const projects = JSON.parse(localStorage.getItem('projects') || '[]');
                
                document.getElementById('result2').innerHTML = `
                    Members: ${Object.keys(members).length} items<br>
                    Assignments: ${assignments.length} items<br>
                    Projects: ${projects.length} items
                `;
            } catch (e) {
                document.getElementById('result2').textContent = '❌ Error: ' + e.message;
            }
        }

        function testMembersInit() {
            try {
                if (typeof initializeDefaultMembers === 'function') {
                    initializeDefaultMembers();
                    const members = JSON.parse(localStorage.getItem('teamMembers') || '{}');
                    document.getElementById('result3').innerHTML = `
                        ✅ Members initialized: ${Object.keys(members).length} members<br>
                        Names: ${Object.values(members).map(m => m.name).join(', ')}
                    `;
                } else {
                    document.getElementById('result3').textContent = '❌ initializeDefaultMembers function not found';
                }
            } catch (e) {
                document.getElementById('result3').textContent = '❌ Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
